name: Automated Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Publish Release Binary
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6

      - name: Build Standalone Executable
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name "CustomCalculator" --icon "assets/icons/app_icon.ico" --add-data "assets;assets" main.py

      - name: Generate Release Notes & Status Metadata
        id: meta
        shell: python
        run: |
          import os
          ref = os.environ.get("GITHUB_REF_NAME", "")
          clean_v = ref.lstrip("v")
          
          status_title = f"Custom Calculator {ref}"
          body = f"Official standalone release binary for Custom Calculator {ref}.\nDownload `CustomCalculator.exe` below to run immediately on Windows with zero setup.\n\n"
          
          if clean_v in ("0.5.0", "0.6.0"):
              status_title = f"Custom Calculator {ref} [Deprecated]"
              body += "Status: deprecated\n"
          elif clean_v == "0.7.0":
              status_title = f"Custom Calculator {ref} [Not Recommended]"
              body += "Status: not_recommended\n"
          else:
              body += "Status: functional\nNot recommended: v0.7.0\nDeprecated versions: v0.5.0, v0.6.0\n\n"
              try:
                  with open("CHANGELOG.md", "r", encoding="utf-8") as cf:
                      ccontent = cf.read()
                  import re
                  m = re.search(r"## \[" + re.escape(clean_v) + r"\][^\n]*\n(.*?)(?=\n## \[|\Z)", ccontent, re.DOTALL)
                  if m:
                      body += m.group(1).strip() + "\n"
              except Exception:
                  pass

          with open("release_notes.txt", "w", encoding="utf-8") as f:
              f.write(body)
          
          gh_output = os.environ.get("GITHUB_OUTPUT")
          if gh_output:
              with open(gh_output, "a", encoding="utf-8") as f:
                  f.write(f"title={status_title}\n")

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CustomCalculator.exe
          name: ${{ steps.meta.outputs.title }}
          body_path: release_notes.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

