name: Automated Release

on:
  push:
    tags:
      - 'v*.*.0'

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Publish Release Binary
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6

      - name: Build Standalone Executable
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name "CustomCalculator" --icon "assets/icons/app_icon.ico" --add-data "assets;assets" main.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CustomCalculator.exe
          name: Custom Calculator ${{ github.ref_name }}
          body: |
            Official standalone release binary for Custom Calculator ${{ github.ref_name }}.
            Download `CustomCalculator.exe` below to run immediately on Windows with zero setup.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

