<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#323238"/>
      <stop offset="100%" stop-color="#222226"/>
    </linearGradient>
    <linearGradient id="opGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#484852"/>
      <stop offset="100%" stop-color="#36363E"/>
    </linearGradient>
    <linearGradient id="eqGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D4D4D8"/>
    </linearGradient>
  </defs>

  <!-- Calculator Vertical Rectangular Body (160x216, Aspect Ratio ~1:1.35) -->
  <rect x="48" y="20" width="160" height="216" rx="26" fill="url(#bodyGrad)" stroke="#787882" stroke-width="4" />
  <rect x="50" y="22" width="156" height="212" rx="24" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-opacity="0.45" />

  <!-- Recessed Display Screen (128x44) -->
  <rect x="64" y="36" width="128" height="44" rx="10" fill="#09090B" stroke="#484850" stroke-width="2" />
  <!-- Display Inset Highlight -->
  <line x1="70" y1="40" x2="186" y2="40" stroke="#27272A" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Digital LCD Readout Graphics (Pure Vector Glyphs) -->
  <rect x="72" y="46" width="24" height="4" rx="2" fill="#52525B" />
  <!-- Vector Numeral '0' -->
  <rect x="162" y="50" width="20" height="18" rx="4" fill="#F4F4F5" />
  <rect x="167" y="54" width="10" height="10" rx="2" fill="#09090B" />
  <!-- Vector Decimal Point '.' -->
  <circle cx="156" cy="65" r="2.5" fill="#F4F4F5" />
  <!-- Vector Numeral '0' -->
  <rect x="130" y="50" width="20" height="18" rx="4" fill="#A1A1AA" />
  <rect x="135" y="54" width="10" height="10" rx="2" fill="#09090B" />

  <!-- Keypad Matrix (3 cols x 4 rows) -->
  <!-- Row 0: C, +/-, ÷ -->
  <rect x="64" y="92" width="36" height="23" rx="6" fill="url(#opGrad)" stroke="#52525B" stroke-width="1" />
  <rect x="110" y="92" width="36" height="23" rx="6" fill="url(#opGrad)" stroke="#52525B" stroke-width="1" />
  <rect x="156" y="92" width="36" height="23" rx="6" fill="url(#opGrad)" stroke="#52525B" stroke-width="1" />
  <!-- Row 0 Clean Vector Glyphs -->
  <path d="M 87 99 C 81 99 77 101.5 77 103.5 C 77 105.5 81 108 87 108" fill="none" stroke="#E4E4E7" stroke-width="2" stroke-linecap="round" />
  <line x1="124" y1="103.5" x2="132" y2="103.5" stroke="#E4E4E7" stroke-width="2" stroke-linecap="round" />
  <line x1="128" y1="99.5" x2="128" y2="107.5" stroke="#E4E4E7" stroke-width="2" stroke-linecap="round" />
  <line x1="168" y1="103.5" x2="180" y2="103.5" stroke="#E4E4E7" stroke-width="2" stroke-linecap="round" />
  <circle cx="174" cy="99.5" r="1.5" fill="#E4E4E7" />
  <circle cx="174" cy="107.5" r="1.5" fill="#E4E4E7" />

  <!-- Row 1: 7, 8, × -->
  <rect x="64" y="122" width="36" height="23" rx="6" fill="url(#btnGrad)" stroke="#3F3F46" stroke-width="1" />
  <rect x="110" y="122" width="36" height="23" rx="6" fill="url(#btnGrad)" stroke="#3F3F46" stroke-width="1" />
  <rect x="156" y="122" width="36" height="23" rx="6" fill="url(#opGrad)" stroke="#52525B" stroke-width="1" />
  <!-- Row 1 Dots / Icons -->
  <circle cx="82" cy="133.5" r="3" fill="#D4D4D8" />
  <circle cx="128" cy="133.5" r="3" fill="#D4D4D8" />
  <line x1="169.5" y1="129" x2="178.5" y2="138" stroke="#E4E4E7" stroke-width="2" stroke-linecap="round" />
  <line x1="178.5" y1="129" x2="169.5" y2="138" stroke="#E4E4E7" stroke-width="2" stroke-linecap="round" />

  <!-- Row 2: 4, 5, − -->
  <rect x="64" y="152" width="36" height="23" rx="6" fill="url(#btnGrad)" stroke="#3F3F46" stroke-width="1" />
  <rect x="110" y="152" width="36" height="23" rx="6" fill="url(#btnGrad)" stroke="#3F3F46" stroke-width="1" />
  <rect x="156" y="152" width="36" height="23" rx="6" fill="url(#opGrad)" stroke="#52525B" stroke-width="1" />
  <!-- Row 2 Dots / Icons -->
  <circle cx="82" cy="163.5" r="3" fill="#D4D4D8" />
  <circle cx="128" cy="163.5" r="3" fill="#D4D4D8" />
  <line x1="169" y1="163.5" x2="179" y2="163.5" stroke="#E4E4E7" stroke-width="2" stroke-linecap="round" />

  <!-- Row 3: 1, = (wide) -->
  <rect x="64" y="182" width="36" height="23" rx="6" fill="url(#btnGrad)" stroke="#3F3F46" stroke-width="1" />
  <circle cx="82" cy="193.5" r="3" fill="#D4D4D8" />

  <!-- Wide Accent Equals Key -->
  <rect x="110" y="182" width="82" height="23" rx="6" fill="url(#eqGrad)" stroke="#FFFFFF" stroke-width="1" />
  <line x1="142" y1="190" x2="160" y2="190" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" />
  <line x1="142" y1="196" x2="160" y2="196" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" />
</svg>